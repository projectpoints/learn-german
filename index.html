  // ---------- Web3Forms Helper (demo mode + live ready) ----------
  async function submitWeb3Form(formElement, statusElement, successMsg = '✅ Submitted! We’ll get back soon.') {
    const formData = new FormData(formElement);
    const accessKey = formData.get('access_key');
    if (!accessKey || accessKey === 'YOUR-ACCESS-KEY-HERE') {
      if(statusElement) {
        statusElement.innerHTML = '⚠️ Demo mode: Request captured (replace access_key for live email).';
        statusElement.style.color = '#e11d48';
        formElement.reset();
        setTimeout(() => { if(statusElement) statusElement.innerHTML = '✨ Demo lead recorded — our team will connect.'; }, 1200);
      }
      return false;
    }
    try {
      const response = await fetch('https://web3forms.com/api/v1/submit', { method: 'POST', body: formData });
      const result = await response.json();
      if(result.success) {
        if(statusElement) { statusElement.innerHTML = successMsg; statusElement.style.color = '#16a34a'; }
        formElement.reset();
        return true;
      } else {
        if(statusElement) { statusElement.innerHTML = '❌ Error: ' + (result.message || 'Submission failed'); statusElement.style.color = '#dc2626'; }
        return false;
      }
    } catch (error) {
      if(statusElement) { statusElement.innerHTML = '⚠️ Network error. Please try again.'; statusElement.style.color = '#dc2626'; }
      return false;
    }
  }

  // -------------- ROUTING & INITIALIZATION --------------
  const appRoot = document.getElementById('app-root');
  let currentPage = 'home';

  function setActiveNav(pageId) {
    const navIds = ['nav-home', 'nav-about', 'nav-contact', 'nav-privacy', 'nav-terms'];
    navIds.forEach(id => {
      const el = document.getElementById(id);
      if(el) {
        if((pageId === 'home' && id === 'nav-home') ||
           (pageId === 'about' && id === 'nav-about') ||
           (pageId === 'contact' && id === 'nav-contact') ||
           (pageId === 'privacy' && id === 'nav-privacy') ||
           (pageId === 'terms' && id === 'nav-terms')) {
          el.classList.add('active-page');
        } else {
          el.classList.remove('active-page');
        }
      }
    });
  }

  function renderPage(page) {
    currentPage = page;

    else if(page === 'about') appRoot.innerHTML = renderAbout();
    else if(page === 'contact') appRoot.innerHTML = renderContact();
    else if(page === 'privacy') appRoot.innerHTML = renderPrivacy();
    else if(page === 'terms') appRoot.innerHTML = renderTerms();
    
    setActiveNav(page);

    // Reattach form handlers and curriculum tabs only on home page
    if(page === 'home') {
      attachHomeFormHandler();
      attachCurriculumTabs();
    } else if(page === 'contact') {
      const contactForm = document.getElementById('contactPageForm');
      const contactStatus = document.getElementById('contactStatus');
      if(contactForm) {
        contactForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          if(contactStatus) contactStatus.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
          await submitWeb3Form(contactForm, contactStatus, '✅ Message received! We’ll reply within 2 hours.');
          setTimeout(() => { if(contactStatus && contactStatus.innerHTML.includes('✅')) setTimeout(() => contactStatus.innerHTML = '', 3500); }, 2000);
        });
      }
    }
  }

  function attachHomeFormHandler() {
    const heroForm = document.getElementById('heroMainForm');
    const heroStatus = document.getElementById('heroFormStatus');
    if(heroForm) {
      heroForm.removeEventListener('submit', heroForm._listener);
      const handler = async (e) => {
        e.preventDefault();
        if(heroStatus) heroStatus.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending request...';
        await submitWeb3Form(heroForm, heroStatus, '✅ Success! Expert will call you within 2 hours for demo & counselling.');
        setTimeout(() => { if(heroStatus && heroStatus.innerHTML.includes('✅')) setTimeout(() => heroStatus.innerHTML = '', 4000); }, 2500);
      };
      heroForm.addEventListener('submit', handler);
      heroForm._listener = handler;
    }
  }

  function attachCurriculumTabs() {
    const tabBtns = document.querySelectorAll('.tab-btn');
    const contents = document.querySelectorAll('.level-content');
    if(!tabBtns.length) return;
    function activateTab(levelId) {
      contents.forEach(c => c.classList.remove('active-content'));
      const activeEl = document.getElementById(levelId);
      if(activeEl) activeEl.classList.add('active-content');
      tabBtns.forEach(btn => {
        if(btn.getAttribute('data-level') === levelId) btn.classList.add('active');
        else btn.classList.remove('active');
      });
    }
    tabBtns.forEach(btn => {
      btn.removeEventListener('click', btn._listener);
      const clickHandler = () => activateTab(btn.getAttribute('data-level'));
      btn.addEventListener('click', clickHandler);
      btn._listener = clickHandler;
    });
  }

  // navigation event binding
  function bindNavigation() {
    const pages = ['home', 'about', 'contact', 'privacy', 'terms'];
    pages.forEach(p => {
      const navLink = document.getElementById(`nav-${p}`);
      const footerLink = document.getElementById(`footer-${p}`);
      if(navLink) navLink.addEventListener('click', (e) => { e.preventDefault(); renderPage(p); window.scrollTo({top:0, behavior:'smooth'}); });
      if(footerLink) footerLink.addEventListener('click', (e) => { e.preventDefault(); renderPage(p); window.scrollTo({top:0, behavior:'smooth'}); });
    });
  }

  renderPage('home');
  bindNavigation();
</script>
</body>
</html>
